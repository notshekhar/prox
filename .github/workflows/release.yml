# Builds the installer's assets when a version tag is pushed. Plugins load through
# cgo, which can't be cross-compiled from one machine, so each system builds its
# own. Linux builds on the oldest supported runner, because a binary only runs on
# a glibc as new as the one it was built against.
#
# Assets: prox-<os>-<arch>.tar.gz holding <os>-<arch>/prox,
# plus a .sha256 beside each. The folder inside the tarball lets the installer
# swap a whole directory into place.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: macos-15, goos: darwin, goarch: arm64, target: darwin-arm64 }
          - { runner: macos-15, goos: darwin, goarch: amd64, target: darwin-x64, cc: "clang -arch x86_64" }
          - { runner: ubuntu-22.04, goos: linux, goarch: amd64, target: linux-x64 }
          - { runner: ubuntu-22.04-arm, goos: linux, goarch: arm64, target: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2

      - name: Build dashboard
        working-directory: dashboard
        run: bun install --frozen-lockfile && bun run build

      - name: Build binary
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc || 'cc' }}
          TARGET: ${{ matrix.target }}
        run: |
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          flags="-s -w -X main.Version=$GITHUB_REF_NAME -X main.Commit=${GITHUB_SHA::7} -X main.BuildDate=$built"
          mkdir -p "dist/$TARGET"
          go build -trimpath -ldflags "$flags" -o "dist/$TARGET/prox" ./cmd/server
          tar -czf "dist/prox-$TARGET.tar.gz" -C dist "$TARGET"
          (cd dist && shasum -a 256 "prox-$TARGET.tar.gz" > "prox-$TARGET.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: prox-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --generate-notes
